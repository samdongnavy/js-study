<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뽀모도로 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 class="title">뽀모도로 타이머</h1>
    <div id="mode" class="mode">집중 시간</div>
    <div id="timer" class="timer">25:00</div>
    
    <div class="btn-group">
      <button id="start-btn" class="btn primary">시작</button>
      <button id="reset-btn" class="btn secondary">초기화</button>
    </div>

    <div>
      <button id="mode-btn" class="btn switch">집중/휴식 바꾸기</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
